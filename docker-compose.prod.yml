services:
  db:
    image: postgres:16-alpine
    container_name: verlof-ouderschap-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-verlof}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is verplicht in productie}
      POSTGRES_DB: ${POSTGRES_DB:-verlof}
      TZ: ${TZ:-Europe/Amsterdam}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-verlof} -d ${POSTGRES_DB:-verlof}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    image: ${REGISTRY}/verlof-ouderschap-app:${IMAGE_TAG:-latest}
    container_name: verlof-ouderschap-app
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-verlof}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-verlof}?schema=public
      TZ: ${TZ:-Europe/Amsterdam}
      NODE_ENV: production
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - shelly-network
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.verlof.rule=Host(`verlof.shelly-nas.nl`)"
      - "traefik.http.routers.verlof.entrypoints=web"
      - "traefik.http.services.verlof.loadbalancer.server.port=3000"

volumes:
  pgdata:
    driver: local

networks:
  shelly-network:
    external: true
