# Production stack.
#
# IMAGE_TAG is the commit on main that is deployed, written into .env by the
# deploy workflow. Pinning it rather than tracking 'latest' keeps a container
# restart from silently pulling a newer build, and makes a rollback deploying
# an earlier commit.
#
# The database lives in the external volume verlof-ouderschap_pgdata (see the
# bottom of this file). The schema is created by database/init.sql on the first start of
# that empty volume. Once it holds data, a schema change can no longer go there:
# add a migration under server/migrations/ instead, which the server applies
# on startup.
services:
  db:
    # Eigen image: het schema zit erin gebakken, omdat de deploy alleen dit
    # compose-bestand naar de host kopieert en een bind mount naar
    # ./database/ daar niet bestaat.
    image: ${REGISTRY}/verlof-ouderschap-db:${IMAGE_TAG:?IMAGE_TAG is verplicht - zet een commit, niet latest}
    container_name: verlof-ouderschap-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-verlof}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is verplicht in productie}
      POSTGRES_DB: ${DB_NAME:-verlof}
      TZ: ${TZ:-Europe/Amsterdam}
    volumes:
      # Extern volume: de productiedata blijft staan bij elke deploy, ook bij
      # `docker compose down -v`. Zie `volumes:` onderaan.
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${DB_USER:-verlof} -d ${DB_NAME:-verlof}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  server:
    image: ${REGISTRY}/verlof-ouderschap-server:${IMAGE_TAG:?IMAGE_TAG is verplicht - zet een commit, niet latest}
    container_name: verlof-ouderschap-server
    restart: always
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-verlof}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-verlof}
      SERVER_PORT: 3000
      # De commit die draait; GET /api/health meldt hem als versie.
      APP_VERSION: ${IMAGE_TAG}
      TZ: ${TZ:-Europe/Amsterdam}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Node-backend. Voor een Python-backend:
      # ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:3000/api/health', timeout=4).status == 200 else 1)"]
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - shelly-network
      - default
    labels:
      - "traefik.enable=true"
      # Two networks: tell Traefik which one it can reach, or it may pick
      # the stack's default network and answer 504 Gateway Timeout.
      - "traefik.docker.network=shelly-network"
      - "traefik.http.routers.verlof-api.rule=Host(`verlof.shelly-nas.nl`) && PathPrefix(`/api`)"
      - "traefik.http.routers.verlof-api.entrypoints=web"
      - "traefik.http.services.verlof-api.loadbalancer.server.port=3000"

  client:
    image: ${REGISTRY}/verlof-ouderschap-client:${IMAGE_TAG:?IMAGE_TAG is verplicht - zet een commit, niet latest}
    container_name: verlof-ouderschap-client
    restart: always
    environment:
      TZ: ${TZ:-Europe/Amsterdam}
    depends_on:
      - server
    networks:
      - shelly-network
      - default
    labels:
      - "traefik.enable=true"
      # Two networks: tell Traefik which one it can reach, or it may pick
      # the stack's default network and answer 504 Gateway Timeout.
      - "traefik.docker.network=shelly-network"
      - "traefik.http.routers.verlof.rule=Host(`verlof.shelly-nas.nl`)"
      - "traefik.http.routers.verlof.entrypoints=web"
      - "traefik.http.services.verlof.loadbalancer.server.port=80"

networks:
  shelly-network:
    external: true

volumes:
  # De productiedatabase. Extern, met een vaste naam: compose maakt hem niet
  # aan en verwijdert hem nooit, ook niet met `docker compose down -v`, en de
  # opschoonstappen van de shared-workflows laten hem staan. deploy.yml geeft
  # dezelfde naam mee als `persistent_volumes`; deploy-production.yml maakt het
  # volume bij de eerste deploy aan en hergebruikt het daarna. Weggooien kan
  # alleen bewust: `docker volume rm verlof-ouderschap_pgdata`.
  #
  # verlof-ouderschap_pgdata is het volume waarin de eerdere Next.js-versie van
  # deze app haar data al bewaarde; zo gaat die data zonder kopiëren mee.
  db_data:
    external: true
    name: verlof-ouderschap_pgdata
