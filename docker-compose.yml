services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-verlof}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-verlof}
      POSTGRES_DB: ${POSTGRES_DB:-verlof}
      TZ: ${TZ:-Europe/Amsterdam}
    ports:
      - "5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-verlof} -d ${POSTGRES_DB:-verlof}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-verlof}:${POSTGRES_PASSWORD:-verlof}@db:5432/${POSTGRES_DB:-verlof}?schema=public
      TZ: ${TZ:-Europe/Amsterdam}
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      # De host mag de installatie en build-cache in de container niet overschrijven.
      - /app/node_modules
      - /app/.next

volumes:
  pgdata-dev:
