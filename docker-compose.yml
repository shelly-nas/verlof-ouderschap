services:
  client: # Frontend service (nginx serving the built Vite app)
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "5173:80"  # Browse the app at http://localhost:5173
    depends_on:
      - server

  server: # Backend service
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "3000:3000"  # API only - there is no page at http://localhost:3000/
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-verlof}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD ontbreekt - zet hem in .env}
      DB_NAME: ${DB_NAME:-verlof}
      SERVER_PORT: 3000
    depends_on:
      db:
        condition: service_healthy

  db: # PostgreSQL database
    image: postgres:16-alpine  # Pinned: `latest` breaks an existing data volume on a major upgrade
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-verlof}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD ontbreekt - zet hem in .env}
      POSTGRES_DB: ${DB_NAME:-verlof}
    volumes:
      - db_data:/var/lib/postgresql/data
      # Draait alleen bij een leeg volume, in bestandsvolgorde. Zodra 1.0.0
      # ergens met data draait, moet een schemawijziging een migratie worden -
      # dit script wordt op een bestaand volume nooit opnieuw uitgevoerd.
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      # Alleen lokaal: demodata om tegen te testen. Staat bewust niet in
      # database/Dockerfile, dus productie krijgt dit bestand nooit.
      - ./database/seed-demo.sql:/docker-entrypoint-initdb.d/03-seed-demo.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-verlof} -d ${DB_NAME:-verlof}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  db_data:
    driver: local
